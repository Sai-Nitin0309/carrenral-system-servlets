<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register Car</title>
  <style>
    /* ====== Global Styles ====== */
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      /* 🚘 Car background image */
      background: 
        linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
        url("https://images.pexels.com/photos/170811/pexels-photo-170811.jpeg?auto=compress&cs=tinysrgb&h=1080&w=1920");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ====== Form Container (Glassmorphism) ====== */
    .form-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 420px;
      animation: fadeIn 1s ease-in-out;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ====== Heading ====== */
    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ====== Input Groups (Floating Labels) ====== */
    .input-group {
      position: relative;
      margin-bottom: 22px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: #00d4ff;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
    }

    .input-group label {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: #ddd;
      font-size: 14px;
      pointer-events: none;
      transition: 0.3s ease;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: -8px;
      left: 10px;
      font-size: 12px;
      color: #00d4ff;
      background: rgba(0, 0, 0, 0.7);
      padding: 0 6px;
      border-radius: 4px;
    }

    /* ====== Submit Button ====== */
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #00d4ff, #007bff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #0099cc, #0056b3);
      box-shadow: 0 6px 16px rgba(0, 150, 255, 0.45);
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.97);
    }

    /* ====== Responsive ====== */
    @media (max-width: 500px) {
      .form-container {
        padding: 30px 20px;
      }
      h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>🚘 Register a Car</h2>
    <form action="car" method="POST">

      <div class="input-group">
        <input type="text" id="carname" name="carname" placeholder=" " required>
        <label for="carname">Car Name</label>
      </div>

      <div class="input-group">
        <input type="number" id="carid" name="carid" placeholder=" " required>
        <label for="carid">Car ID</label>
      </div>

      <div class="input-group">
        <input type="text" id="carmodel" name="carmodel" placeholder=" " required>
        <label for="carmodel">Car Model</label>
      </div>

      <div class="input-group">
        <input type="text" id="carnumber" name="carnumber" placeholder=" " required>
        <label for="carnumber">Car Number</label>
      </div>

      <div class="input-group">
        <input type="text" id="carownername" name="carownername" placeholder=" " required>
        <label for="carownername">Car Owner Name</label>
      </div>

      <button type="submit">Register Car</button>
    </form>
  </div>

</body>
</html>
